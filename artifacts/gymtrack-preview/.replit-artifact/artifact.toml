kind = "web"
previewPath = "/"
title = "My Routine"
description = "Preview routing adapter for the My Routine React and Vite application in gymtrack-working."
version = "1.0.0"
id = "artifacts/gymtrack-preview"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24878

[services.development]
run = "cd ../../gymtrack-working && npm run dev -- --host 0.0.0.0 --port $PORT --strictPort"

[services.production]
build = [ "npm", "--prefix", "gymtrack-working", "run", "build" ]
serve = "static"
publicDir = "gymtrack-working/.output/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24878"
BASE_PATH = "/"
